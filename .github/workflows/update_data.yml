name: Update Match Fixtures

on:
  schedule:
    - cron: '0 */3 * * *' # UTC 기준 3시간마다 정각 (KST 기준 아침 9시, 낮 12시...)
  workflow_dispatch:

jobs:
  run-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: update_data.py # 메인 일정 스크립트명
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update fixtures [skip ci]" && git push)
