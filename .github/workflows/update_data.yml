name: Auto Update Match Data

on:
  schedule:
    # 매일 자정(UTC 기준, 한국 시간 오전 9시)에 자동 실행 예시
    - cron: '0 0 * * *'
  workflow_dispatch:  # GitHub Actions 탭에서 수동으로 즉시 실행 버튼을 누를 수도 있습니다.

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run update script
        run: python update_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json via GitHub Actions" && git push)
