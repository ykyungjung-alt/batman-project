name: Match Details Crawler V3

on:
  schedule:
    - cron: '5 */3 * * *' # 정각보다 5분 뒤에 실행하여 데이터 충돌 방지
  workflow_dispatch:
  
jobs:
  run-crawler-v3:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Crawler V3
      run: |
        python crawler_fixtures3.py

    - name: Commit and push generated match details v3
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add match_details_v3.json
        git commit -m "Auto-update match details v3 [skip ci]" || exit 0
        
        # 💡 원격 변경 사항을 가져올 때 충돌 시 로컬(현재 방금 크롤링한 것) 데이터를 우선하도록 설정
        git pull --rebase -X theirs origin main || echo "No remote changes to pull"
        git push
