name: Match Data Crawler

# 실행 주기를 설정합니다 (예: 매일 한국 시간 아침 8시에 자동 실행)
on:
  schedule:
    - cron: '0 23 * * *' # UTC 기준 밤 11시 = KST 기준 아침 8시
  workflow_dispatch: # 수동으로도 언제든 GitHub 웹에서 실행 버튼을 누를 수 있게 허용

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Crawler Script
        run: |
          python crawler_fixtures.py

      - name: Commit and Push changes if match_details.json updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add match_details.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update match_details.json [skip ci]" && git push)
