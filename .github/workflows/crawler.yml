name: Match Details Crawler

on:
  schedule:
    - cron: '5 */3 * * *' # 정각보다 5분 뒤에 실행하여 데이터 충돌 방지
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python crawler_fixtures.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add match_details.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update match_details.json (3h interval + 5m offset) [skip ci]" && git push)
